<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EC-Scout 3D</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg1:#dfe8f1;--bg2:#b9c8d8;--ink:#10202f;--chip:rgba(255,255,255,.85);--chipb:#1d4f91;--lbl:#0b1b2b;--lblbg:rgba(255,255,255,.92)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#1b2735;--bg2:#0a1118;--ink:#e6eef7;--chip:rgba(20,32,46,.88);--chipb:#6fb1ff;--lbl:#e6eef7;--lblbg:rgba(14,24,36,.9)}}
:root[data-theme="dark"]{--bg1:#1b2735;--bg2:#0a1118;--ink:#e6eef7;--chip:rgba(20,32,46,.88);--chipb:#6fb1ff;--lbl:#e6eef7;--lblbg:rgba(14,24,36,.9)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;overflow:hidden;background:radial-gradient(ellipse at 50% 30%,var(--bg1),var(--bg2));color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;touch-action:none}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;left:14px;top:calc(12px + env(safe-area-inset-top,0px));pointer-events:none}
#hud b{font-size:18px;letter-spacing:.2px}#hud span{display:block;font-size:12px;opacity:.7;margin-top:2px}
#bar{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
button{font:inherit;font-size:13px;padding:8px 14px;border-radius:999px;border:1.5px solid var(--chipb);background:var(--chip);color:var(--ink);cursor:pointer}
button[aria-pressed="true"]{background:var(--chipb);color:#fff}
button:focus-visible{outline:3px solid var(--chipb);outline-offset:2px}
.lbl{position:fixed;left:0;top:0;font-size:11.5px;line-height:1.2;padding:3px 7px;border-radius:5px;background:var(--lblbg);color:var(--lbl);border:1px solid var(--chipb);white-space:nowrap;pointer-events:none;transform:translate(-50%,-130%)}
.lbl::after{content:"";position:absolute;left:50%;top:100%;width:1px;height:10px;background:var(--chipb)}
#info{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));max-width:min(440px,92vw);display:none;background:var(--lblbg);color:var(--lbl);border:1px solid var(--chipb);border-radius:8px;padding:10px 14px;font-size:13px;line-height:1.4}#info b{display:block;margin-bottom:2px;font-size:14px}.lbl{pointer-events:auto;cursor:pointer}.lbl.sel{background:var(--chipb);color:#fff}
</style>
</head>
<body>
<div id="hud"><b>EC-Scout</b><span>Tap the screen to run a test. Click parts for details. Open the top to see the electronics.</span></div>
<div id="info"></div>
<div id="bar">
<button id="bL" aria-pressed="true">Labels</button>
<button id="bR" aria-pressed="false">Auto-rotate</button>
<button id="bP" aria-pressed="true">Power</button>
<button id="bD" aria-pressed="true">Chamber door</button>
<button id="bT" aria-pressed="false">Open top</button>
<button id="bV">Reset view</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

cyl(.2,.2,.04,TX+1.05,.26,TZ+.7,mat(0xcfd6dd)).rotation.z=Math.PI/2;

add(new T.BoxGeometry(4.4,.1,3),glass(0xeaf0f7,.6),BX,.05,TZ);
[[0,-1.5,4.4,.04],[0,1.5,4.4,.04]].forEach(function(w){add(new T.BoxGeometry(w[2],.8,w[3]),glass(0xeaf0f7,.35),BX+w[0],.4,TZ+w[1])});
[[-2.2],[2.2]].forEach(function(w){add(new T.BoxGeometry(.04,.8,3),glass(0xeaf0f7,.35),BX+w[0],.4,TZ)});
for(var b=0;b<3;b++){cyl(.3,.3,.85,BX-1.4+b*.8,.52,TZ-.5,glass(0xffffff,.65));cyl(.22,.22,.2,BX-1.4+b*.8,1.02,TZ-.5,mat(0xf4f6f8))}
add(new T.BoxGeometry(.4,1.1,.4),glass(0xcfe6ff,.4),BX+1.1,.65,TZ+.3);
add(new T.BoxGeometry(.4,1.1,.4),glass(0xcfe6ff,.4),BX+1.7,.65,TZ+.3);
add(new T.BoxGeometry(.32,.8,.32),mat(0x5b21b6,{transparent:true,opacity:.9}),BX+1.7,.5,TZ+.3);

// labels
var LBL=[
['7" touchscreen (Raspberry Pi)',-2.3,4.75,-.2],['Power button',4.35,4.65,-.3],['GPS / Wi-Fi antenna',5.0,4.8,-1.9],
['USB digital microscope',MX,2.55,0],['Blue LED, 450–470 nm',MX-1.4,1.1,.2],['Emission filter, 570–600 nm',MX+.55,.95,.1],
['Sample filter (Nile Red)',MX,.8,.6],['PFAS cuvette holder',PX,2.35,.2],['White backlight',PX,.8,.9],
['USB / USB-C ports',4.95,2.4,1.4],['Nile Red solution',TX+1.6,1.2,TZ-.3],['Syringe',TX-.6,.4,TZ+.7],
['Stained membrane',TX+.5,.35,TZ-.5],['Extraction reagents R1–R3',BX-.6,1.3,TZ-.5],['Sample and control cuvettes',BX+1.4,1.3,TZ+.3]
].map(function(a){var d=document.createElement('div');d.className='lbl';d.textContent=a[0];document.body.appendChild(d);return{el:d,p:new T.Vector3(a[1],a[2],a[3])}});

// orbit controls (no external deps)

var st={th:home.th,ph:home.ph,r:home.r},auto=false,showL=true;
var ptrs={},lastD=0,pan=false;
function cam(){var s=Math.sin(st.ph);camera.position.set(target.x+st.r*s*Math.sin(st.th),target.y+st.r*Math.cos(st.ph),target.z+st.r*s*Math.cos(st.th));camera.lookAt(target)}
var el=renderer.domElement;
el.addEventListener('pointerdown',function(e){el.setPointerCapture(e.pointerId);ptrs[e.pointerId]={x:e.clientX,y:e.clientY};pan=e.button===2||e.shiftKey});
el.addEventListener('contextmenu',function(e){e.preventDefault()});
el.addEventListener('pointermove',function(e){var p=ptrs[e.pointerId];if(!p)return;var dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
 var ids=Object.keys(ptrs);
 if(ids.length===2){var a=ptrs[ids[0]],b=ptrs[ids[1]],d=Math.hypot(a.x-b.x,a.y-b.y);if(lastD)st.r=Math.min(40,Math.max(5,st.r*lastD/d));lastD=d;return}
 if(pan){var k=st.r*.0015,right=new T.Vector3().setFromMatrixColumn(camera.matrix,0);target.addScaledVector(right,-dx*k);target.y+=dy*k}
 else{st.th-=dx*.006;st.ph=Math.min(1.53,Math.max(.15,st.ph-dy*.006))}});

// ---- interaction ----
var tableM=root.children[0];
var power=true,ledOn=true,state={mode:'home',kind:'',t0:0,prog:0,val:0},hist=[],lastStep=-1,liqT=0,doorGoal=-1.9,doorA=-1.9;

drawScreen();
function setPower(p){power=p;state.mode=p?'home':'off';state.kind='';drawScreen();bP.setAttribute('aria-pressed',p)}
function setDoor(open){doorGoal=open?-1.9:0;bD.setAttribute('aria-pressed',open)}
bD.setAttribute('aria-pressed',true);bP.setAttribute('aria-pressed',true);
function start(kind){state.mode='run';state.kind=kind;state.t0=performance.now();state.prog=0;lastStep=-1;if(kind==='mp')setDoor(false);drawScreen()}
function tapScreen(uv){
 if(!power)return;var x=uv.x*768,y=(1-uv.y)*330;
 if(state.mode==='home'){
  if(y>70&&y<230)start(x<384?'mp':'pfas');
  else if(y>250&&x>400&&x<580){state.mode='hist';drawScreen()}
 }else if(state.mode==='result'||state.mode==='hist'){state.mode='home';state.kind='';drawScreen()}
}
function select(i){
 LBL.forEach(function(l,j){l.el.classList.toggle('sel',j===i)});
 if(i<0){infoEl.style.display='none';marker.visible=false;return}
 infoEl.innerHTML='<b>'+LBL[i].el.textContent+'</b>'+INFO[i];infoEl.style.display='block';
 marker.position.copy(LBL[i].p);marker.visible=true;
 if(i===1)setPower(!power);
 if(i===4)ledOn=!ledOn;
}
LBL.forEach(function(l,i){l.el.addEventListener('click',function(){select(i)})});
var ray=new T.Raycaster(),down=null,multi=false;
el.addEventListener('pointerdown',function(e){if(Object.keys(ptrs).length>1)multi=true;down={x:e.clientX,y:e.clientY}});
el.addEventListener('pointerup',function(e){
 var wasMulti=multi;if(Object.keys(ptrs).length===0)multi=false;
 if(!down)return;var moved=Math.hypot(e.clientX-down.x,e.clientY-down.y);down=null;
 if(moved<6&&!wasMulti&&e.button===0)clickAt(e);
});
function clickAt(e){
 var r=el.getBoundingClientRect();
 ray.setFromCamera(new T.Vector2((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height*2-1)),camera);
 var hits=ray.intersectObjects(root.children,true).filter(function(h){return h.object!==marker&&h.object!==tableM});
 if(!hits.length){select(-1);return}
 var h=hits[0];
 if(h.object===screen){tapScreen(h.uv);return}
 if(h.object===door){setDoor(doorGoal===0);return}
 if(h.object===cover){setTop(!topOpen);return}
 var best=-1,bd=1.8;
 LBL.forEach(function(l,i){if(l.inner&&!topOpen)return;var d=l.p.distanceTo(h.point);if(d<bd){bd=d;best=i}});
 select(best);
}
var C0=new T.Color(0xdfeeff),C1=new T.Color(0x6d28d9);
function update(t){
 var run=state.mode==='run',mp=state.kind==='mp';
 if(run){
  state.prog=Math.min(1,(performance.now()-state.t0)/5000);
  var s=Math.floor(state.prog*40);if(s!==lastStep){lastStep=s;drawScreen()}
  if(state.prog>=1){
   state.val=mp?Math.round(20+Math.random()*60):Math.round(5+Math.random()*80);
   hist.unshift((mp?'Microplastics: '+state.val+' particles/100 mL':'PFAS: '+state.val+' ng/L'));
   if(hist.length>5)hist.length=5;state.mode='result';drawScreen();
  }
 }
 doorA+=(doorGoal-doorA)*.1;doorP.rotation.x=doorA;
 var led=power&&(ledOn||(run&&mp));
 pl1.intensity*=led?1:0;pl2.intensity*=led?1:0;pl3.intensity=led?1.2:0;
 ledL.material.emissiveIntensity=ledR.material.emissiveIntensity=led?2:.05;
 disc.material.emissiveIntensity=led?(run&&mp?1.6:1.1):.05;filt.material.emissiveIntensity=led?.9:.05;
 bl.material.emissiveIntensity=power?1.3:.05;pl4.intensity=power?1.6:0;
 var goal=state.kind==='pfas'?(state.mode==='run'?state.prog:(state.mode==='result'?1:0)):0;
 liqT+=(goal-liqT)*.08;liq.material.color.copy(C0).lerp(C1,liqT);liq.material.opacity=.35+.5*liqT;
 pb.material.color.setHex(power?0x5fe0c8:0x9aa3ad);
 update2(t);marker.scale.setScalar(1+.15*Math.sin(t*.006));marker.rotation.y=t*.001;
}

// mounting plate, screws, chamber slider

[-4.4,-2.2,0,2.2,4.4].forEach(function(x){[-2.15,-.65].forEach(function(z){cylB(.07,.07,.04,x,2.83,z,SIL)})});

// display back + driver board
bb(4.8,1.6,.03,-2.3,3.75,-.5,mat(0x0e1116));bb(1.3,.7,.03,-1.0,3.5,-.55,PCB);bb(.4,.03,.4,-1.0,3.5,-.58,BLK);
// battery pack
bb(1.45,.1,1.75,-3.85,2.86,-1.4,DK);
[-.45,0,.45].forEach(function(dx){cylB(.2,.2,1.55,-3.85+dx,3.08,-1.4,mat(0x2d6cdf,{roughness:.4}),Math.PI/2);cylB(.1,.1,.06,-3.85+dx,3.08,-.6,SIL,Math.PI/2);cylB(.1,.1,.06,-3.85+dx,3.08,-2.2,SIL,Math.PI/2)});
// Raspberry Pi 4
bb(3.1,.07,1.75,PXc,PYc,PZc,PCB);
[[-1.4,-.75],[1.4,-.75],[-1.4,.75],[1.4,.75]].forEach(function(o){cylB(.06,.06,.18,PXc+o[0],2.86,PZc+o[1],SIL)});
var sil=textTex(512,256,function(c,w,h){c.clearRect(0,0,w,h);c.fillStyle='#e8f5e9';c.font='bold 40px system-ui';c.fillText('Raspberry Pi 4',30,90);c.font='26px system-ui';c.fillText('Model B',30,130);c.strokeStyle='#e8f5e9';c.lineWidth=3;c.beginPath();c.arc(430,70,28,0,7);c.stroke()});
var sp=new T.Mesh(new T.PlaneGeometry(1.0,.5),new T.MeshBasicMaterial({map:sil,transparent:true}));sp.rotation.x=-Math.PI/2;sp.position.set(PXc+.45,PYc+.045,PZc+.5);bay.add(sp);
// heatsink + fan
bb(.9,.1,.9,PXc-.4,PYc+.1,PZc,ALU);
for(var i=0;i<7;i++)bb(.9,.2,.05,PXc-.4,PYc+.25,PZc-.4+i*.133,ALU);
[-.475,.475].forEach(function(o){bb(1,.05,.05,PXc-.4,PYc+.38,PZc+o,DK);bb(.05,.05,1,PXc-.4+o,PYc+.38,PZc,DK)});
var fanG=new T.Group();fanG.position.set(PXc-.4,PYc+.42,PZc);bay.add(fanG);
for(var i=0;i<7;i++){var b2=new T.Mesh(new T.BoxGeometry(.3,.012,.11),DK),a=i/7*Math.PI*2;b2.position.set(Math.cos(a)*.2,0,Math.sin(a)*.2);b2.rotation.y=-a;b2.rotation.z=.4;fanG.add(b2)}
fanG.add(new T.Mesh(new T.CylinderGeometry(.1,.1,.05,16),mat(0x2a3038)));
var ring=new T.Mesh(new T.TorusGeometry(.42,.02,8,40),emi(0x22d3ee,1.4));ring.rotation.x=Math.PI/2;ring.position.set(PXc-.4,PYc+.4,PZc);bay.add(ring);
// chips, GPIO, ports
bb(.55,.05,.4,PXc+.35,PYc+.05,PZc-.15,BLK);bb(.5,.1,.35,PXc+.4,PYc+.07,PZc+.55,SIL);bb(.4,.04,.35,PXc-1.5,PYc-.02,PZc,SIL);
bb(2.2,.14,.16,PXc-.1,PYc+.1,PZc-.72,BLK);
for(var r=0;r<2;r++)for(var k=0;k<20;k++)bb(.03,.1,.03,PXc-1.1+k*.11,PYc+.2,PZc-.76+r*.08,GOLD);
bb(.65,.45,.5,PXc+1.35,PYc+.26,PZc-.45,SIL);bb(.65,.45,.5,PXc+1.35,PYc+.26,PZc+.15,SIL);bb(.7,.5,.55,PXc+1.3,PYc+.28,PZc+.68,SIL);
bb(.3,.12,.18,PXc-.6,PYc+.08,PZc+.8,SIL);bb(.2,.1,.14,PXc-.2,PYc+.07,PZc+.8,SIL);bb(.2,.1,.14,PXc+.1,PYc+.07,PZc+.8,SIL);
var piLed=bb(.06,.03,.06,PXc-1.3,PYc+.05,PZc+.6,emi(0xff2a2a,1.5)),piLed2=bb(.06,.03,.06,PXc-1.2,PYc+.05,PZc+.6,emi(0x22ff66,1.5));
// regulator
bb(.8,.08,.5,1.6,2.85,-1.9,mat(0x1f4fbf));cylB(.15,.15,.2,1.8,3.0,-1.9,SIL);
[1.35,1.5].forEach(function(x){cylB(.09,.09,.22,x,3.0,-1.75,mat(0x22262c));cylB(.07,.07,.02,x,3.12,-1.75,SIL)});
bb(.35,.18,.2,1.95,2.97,-2.1,mat(0x1a8f3c));bb(.06,.03,.06,1.3,2.92,-2.05,emi(0x22d3ee,1.5));
// GPS
bb(.7,.06,.7,3.2,2.82,-1.2,PCB);bb(.45,.08,.45,3.2,2.9,-1.2,mat(0xd7c28a,{metalness:.6}));
// LED strips
var strips=[bb(9.4,.04,.04,0,4.65,-2.3,emi(0x22d3ee,1.4)),bb(9.4,.04,.04,0,4.65,-.5,emi(0x22d3ee,1.4)),bb(.04,.04,1.8,-4.7,4.65,-1.4,emi(0x22d3ee,1.4)),bb(.04,.04,1.8,4.7,4.65,-1.4,emi(0x22d3ee,1.4))];
// wires with travelling data pulses
var pulses=[];
function wire(c,p,r){var cv=new T.CatmullRomCurve3(p.map(function(q){return new T.Vector3(q[0],q[1],q[2])}));var m=new T.Mesh(new T.TubeGeometry(cv,28,r||.025,8),mat(c,{roughness:.4}));m.castShadow=true;bay.add(m);
 for(var j=0;j<2;j++){var s=new T.Mesh(new T.SphereGeometry(.055,10,10),emi(c===0x111111?0xffffff:c,2.2));s.visible=false;bay.add(s);pulses.push({m:s,c:cv,sp:.8+Math.random()*.8,o:j*.5+Math.random()*.2})}}
wire(0xe11d1d,[[-1.6,3.05,-2.1],[-2.4,3.4,-2.3],[-3.6,3.3,-2.0],[-4.7,3.0,-1.8]]);

wire(0x111111,[[1.3,2.9,-1.8],[.6,2.95,-1.6],[.1,3.0,-1.5]],.04);
wire(0xe11d1d,[[-3.4,3.25,-1.0],[-3.0,3.8,-1.0],[0,3.9,-1.0],[1.5,3.5,-1.7],[1.6,3.1,-1.9]],.03);
wire(0xd9822b,[[-1.0,3.5,-.6],[-1.4,3.2,-.7],[-1.7,3.05,-.9]],.07);
wire(0x1e293b,[[-2.05,2.72,-.45],[-2.0,3.2,-.6],[-1.2,3.5,-.9],[-.1,3.3,-1.2]],.06);
function bayAnim(t){
 var on=power;fanG.rotation.y+=on?.45:0;
 ring.material.emissiveIntensity=on?1.4+.4*Math.sin(t*.004):.05;
 strips.forEach(function(m){m.material.emissiveIntensity=on?(topOpen?1.6:.3)+.3*Math.sin(t*.003):.05});
 pulses.forEach(function(p){p.m.visible=on&&topOpen;p.m.position.copy(p.c.getPoint(((t*.0004*p.sp)+p.o)%1))});
}
var bayLight=new T.PointLight(0xffffff,0,9);bayLight.position.set(0,4.4,-1.3);root.add(bayLight);
function addLabel(txt,x,y,z,info){var d=document.createElement('div');d.className='lbl';d.textContent=txt;document.body.appendChild(d);LBL.push({el:d,p:new T.Vector3(x,y,z),inner:true});INFO.push(info);var i=LBL.length-1;d.addEventListener('click',function(){select(i)})}
addLabel('Raspberry Pi 4',-1.4,3.3,-1.1,'Runs the touchscreen app, the microscope image analysis and the colour reading.');
addLabel('GPIO header and wiring',-1.5,3.4,-2.1,'Links the Pi to the LEDs, sensors and modules.');
addLabel('Power regulator',1.6,3.2,-1.9,'Steps the 5 V supply (power bank or USB-C) to what each part needs.');
addLabel('GPS module',3.2,3.1,-1.2,'Tags each sample with its location.');
addLabel('Display ribbon cable',-1.7,3.35,-.7,'Carries the display signal to the 7-inch touchscreen.');
addLabel('USB / Ethernet ports',-.1,3.5,-1.4,'USB ports for the digital microscope and other devices.');
addLabel("Cooling fan",-1.8,3.7,-1.5,"Spins whenever the unit is on to keep the Pi cool.");
addLabel("Li-ion battery pack",-3.85,3.5,-1.4,"Three cells for running the device in the field without mains power.");
var bT=document.getElementById('bT');
function setTop(open){topOpen=open;topGoal=open?-1.8:0;bT.setAttribute('aria-pressed',open);
 if(!open&&LBL.some(function(l){return l.inner&&l.el.classList.contains('sel')}))select(-1);
 camAnim=open?{ph:.55,r:14,tx:0,ty:3,tz:-1.2}:{ph:home.ph,r:home.r,tx:home.t.x,ty:home.t.y,tz:home.t.z}}
bT.addEventListener('click',function(){setTop(!topOpen)});
el.addEventListener('pointerdown',function(){camAnim=null});el.addEventListener('wheel',function(){camAnim=null});
function update2(t){
 topA+=(topGoal-topA)*.1;bayAnim(t);coverP.rotation.x=topA;bayLight.intensity=topOpen?1.2:0;
 if(camAnim){var g=camAnim;st.ph+=(g.ph-st.ph)*.06;st.r+=(g.r-st.r)*.06;target.x+=(g.tx-target.x)*.06;target.y+=(g.ty-target.y)*.06;target.z+=(g.tz-target.z)*.06;if(Math.abs(g.ph-st.ph)<.01&&Math.abs(g.r-st.r)<.1)camAnim=null}
 piLed.material.emissiveIntensity=power?1.5:.05;piLed2.material.emissiveIntensity=power&&Math.sin(t*.01)>0?1.5:.1;
}

bind2();function bind2(){document.getElementById('bP').addEventListener('click',function(){setPower(!power)});document.getElementById('bD').addEventListener('click',function(){setDoor(doorGoal===0)})}
function bind(id,fn){document.getElementById(id).addEventListener('click',fn)}
bind('bL',function(e){showL=!showL;e.currentTarget.setAttribute('aria-pressed',showL)});
bind('bR',function(e){auto=!auto;e.currentTarget.setAttribute('aria-pressed',auto)});
bind('bV',function(){st.th=home.th;st.ph=home.ph;st.r=home.r;target.copy(home.t)});

function resize(){var w=innerWidth,h=innerHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();if(w<640&&st.r<home.r+4&&st.r===home.r){st.r=home.r=26}}
addEventListener('resize',resize);resize();

var v=new T.Vector3(),reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function loop(t){
 requestAnimationFrame(loop);
 if(auto&&!reduce)st.th+=.004;
 cam();
 var pulse=1.9+(reduce?0:Math.sin(t*.003)*.3);
 pl1.intensity=pl2.intensity=pulse+.5;
 var w=innerWidth,h=innerHeight;
 LBL.forEach(function(l){
  if(!showL||(l.inner&&!topOpen)){l.el.style.display='none';return}
  v.copy(l.p);v.project(camera);
  if(v.z>1){l.el.style.display='none';return}
  l.el.style.display='block';
  l.el.style.left=((v.x+1)/2*w)+'px';l.el.style.top=((1-v.y)/2*h)+'px';
 });
 update(t);renderer.render(scene,camera);
}
loop(0);
})();
